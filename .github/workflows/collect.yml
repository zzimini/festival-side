# 매일 TourAPI 행사 수집 → Neon DB upsert
# 필요한 레포 시크릿: DATABASE_URL, TOURAPI_SERVICE_KEY
name: collect

on:
  schedule:
    - cron: "0 19 * * *" # 매일 04:00 KST (UTC 19:00)
  workflow_dispatch: # Actions 탭에서 수동 실행

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # package.json의 packageManager 버전 사용
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile # postinstall에서 prisma generate
      - run: pnpm collect
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TOURAPI_SERVICE_KEY: ${{ secrets.TOURAPI_SERVICE_KEY }}
